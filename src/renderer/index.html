<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>MiniHub</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/omni-pearl.css" />
</head>
<body>
  <header id="app-header" class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">MiniHub</span>
    </div>
    <div class="header-center">
      <span id="device-status" class="device-status idle">Initializing MIDI…</span>
      <div class="transport" aria-label="MiniHub transport">
        <button id="transport-start" class="nav-icon" type="button" title="Back to the start" aria-label="Back to the start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M19 5l-10 7 10 7z"/></svg></button>
        <button id="transport-back" class="nav-icon" type="button" title="Back one bar" aria-label="Back one bar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5l-7 7 7 7zM20 5l-7 7 7 7z"/></svg></button>
        <button id="transport-play" type="button" aria-pressed="false">Play</button>
        <button id="transport-stop" type="button" disabled>Stop</button>
        <button id="transport-forward" class="nav-icon" type="button" title="Forward one bar" aria-label="Forward one bar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5l7 7-7 7zM4 5l7 7-7 7z"/></svg></button>
        <button id="transport-end" class="nav-icon" type="button" title="To the end of the arrangement" aria-label="To the end of the arrangement"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4v16M5 5l10 7-10 7z"/></svg></button>
        <output id="transport-position" class="transport-position" title="Bar and beat" aria-label="Playhead position, bar and beat">1.1</output>
        <label>Tempo <input id="transport-bpm" class="tempo-input" type="number" min="20" max="300" step="1" value="120" aria-label="Global tempo in BPM"> BPM</label>
      </div>
    </div>
    <div class="header-actions">
      <div class="history-controls" aria-label="Edit history">
        <button id="history-undo" class="icon-button" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10h9a5 5 0 0 1 0 10h-3"/>
            <path d="M4 10l4-4M4 10l4 4"/>
          </svg>
        </button>
        <button id="history-redo" class="icon-button" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10h-9a5 5 0 0 0 0 10h3"/>
            <path d="M20 10l-4-4M20 10l-4 4"/>
          </svg>
        </button>
      </div>
      <span id="project-identity" class="project-identity">Untitled</span>
      <button id="settings-button" class="icon-button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="app-body">
    <nav id="sidebar" class="sidebar" aria-label="Modules"></nav>
    <main id="content" class="content"></main>
  </div>

  <div id="modal-root" class="modal-root hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
